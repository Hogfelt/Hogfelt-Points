<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#102d2a"><title>Högfelt Points</title><style>*{box-sizing:border-box}body{margin:0;background:#eef3f0;color:#19322e;font:16px system-ui,-apple-system,Segoe UI,sans-serif}.app{max-width:460px;margin:auto;min-height:100dvh;background:white;padding:28px 22px 42px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:23px;margin:4px 0}small,.muted{color:#6b7c77}.hero{background:#103c35;color:white;border-radius:22px;padding:26px;margin:25px 0 18px;text-align:center}.hero strong{font-size:64px;line-height:1.2;display:block}.hero small{color:#c2dcd4}.bar{height:11px;border-radius:9px;background:#d1e4dd;margin:18px 0 5px;overflow:hidden}.fill{height:100%;background:#67d5ac;transition:width .2s}.row{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #edf0ee;padding:12px 0}.row b{font-size:17px}.controls{display:flex;align-items:center;gap:15px}.controls span{width:27px;text-align:center;font-weight:700}button{cursor:pointer;border:1px solid #d4e1dc;border-radius:12px;background:#f5faf7;color:#16473c;font-size:22px;width:42px;height:42px}button:active{transform:scale(.96)}button:disabled{opacity:.35}.nav{font-size:18px;width:36px;height:36px}.week{font-weight:700}.legend{margin-top:25px;padding:17px;background:#f2f7f4;border-radius:15px;font-size:14px;line-height:1.9}.legend b{display:inline-block;min-width:34px}.foot{margin-top:20px;text-align:center;font-size:12px;color:#75847e}.tag{font-size:12px;color:#4b7b6e}.reset{border:none;background:transparent;font-size:13px;width:auto;height:auto;padding:8px;color:#58776d} .warning{color:#f9c59b}</style></head><body><main class="app"><header><div><small>DIN ENKLA POÄNGBUDGET</small><h1>Högfelt Points 💪</h1></div><span class="tag">10P / vecka</span></header><section class="hero"><small>KVAR DEN HÄR VECKAN</small><strong id="remaining">10P</strong><span id="spent">0 av 10 poäng använda</span><div class="bar"><div class="fill" id="fill" style="width:0%"></div></div><small id="status">Du har hela budgeten kvar!</small></section><div class="row"><button class="nav" id="prev" aria-label="Föregående vecka">‹</button><span class="week" id="week"></span><button class="nav" id="next" aria-label="Nästa vecka">›</button></div><div id="days"></div><div class="legend"><strong>Poängnyckel</strong><div><b>0P</b> Vanliga måltider</div><div><b>1P</b> Godisbit, bulle, kaka, skål popcorn</div><div><b>2P</b> Starköl 33 cl</div><div><b>5P</b> Pizza, kebab, hamburgarmeny</div></div><div class="foot">Sparas automatiskt på den här enheten.<br><button class="reset" id="clear">Nollställ visad vecka</button></div></main><script>const names=['Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag','Söndag'];const pad=n=>String(n).padStart(2,'0');function monday(d){let x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-(x.getDay()+6)%7);return x}function key(d){return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`}const today=monday(new Date());let viewed=new Date(today);function get(){try{let v=JSON.parse(localStorage.getItem('hp-'+key(viewed)));return Array.isArray(v)&&v.length===7?v.map(x=>Math.max(0,Number(x)||0)):[0,0,0,0,0,0,0]}catch{return [0,0,0,0,0,0,0]}}function save(a){localStorage.setItem('hp-'+key(viewed),JSON.stringify(a))}function weekNo(d){let x=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));x.setUTCDate(x.getUTCDate()+4-(x.getUTCDay()||7));let y=new Date(Date.UTC(x.getUTCFullYear(),0,1));return Math.ceil((((x-y)/86400000)+1)/7)}function render(){let a=get(),total=a.reduce((s,n)=>s+n,0),remaining=10-total;document.getElementById('remaining').textContent=remaining+'P';document.getElementById('remaining').className=remaining<0?'warning':'';document.getElementById('spent').textContent=total+' av 10 poäng använda';document.getElementById('fill').style.width=Math.min(100,total*10)+'%';document.getElementById('fill').style.background=total>10?'#ef9b78':'#67d5ac';document.getElementById('status').textContent=total>10?'Över budget – en ny vecka är en ny start':remaining===0?'Hela veckobudgeten använd':remaining===10?'Du har hela budgeten kvar!':'Välj det du verkligen vill unna dig';document.getElementById('week').textContent=`Vecka ${weekNo(viewed)} · ${key(viewed)}`;document.getElementById('next').disabled=key(viewed)===key(today);document.getElementById('days').innerHTML='';names.forEach((name,i)=>{let row=document.createElement('div');row.className='row';let title=document.createElement('b');title.textContent=name;let controls=document.createElement('div');controls.className='controls';let minus=document.createElement('button');minus.textContent='−';minus.setAttribute('aria-label','Minska '+name);minus.disabled=a[i]===0;minus.onclick=()=>{let v=get();v[i]=Math.max(0,v[i]-1);save(v);render()};let count=document.createElement('span');count.textContent=a[i]+'P';let plus=document.createElement('button');plus.textContent='+';plus.setAttribute('aria-label','Öka '+name);plus.onclick=()=>{let v=get();v[i]++;save(v);render()};controls.append(minus,count,plus);row.append(title,controls);document.getElementById('days').append(row)})}document.getElementById('prev').onclick=()=>{viewed.setDate(viewed.getDate()-7);render()};document.getElementById('next').onclick=()=>{if(key(viewed)!==key(today)){viewed.setDate(viewed.getDate()+7);render()}};document.getElementById('clear').onclick=()=>{if(confirm('Nollställa alla poäng för visad vecka?')){save([0,0,0,0,0,0,0]);render()}};render();document.addEventListener('visibilitychange',()=>{if(!document.hidden){let now=monday(new Date());if(key(now)!==key(today)){location.reload()}}});</script></body></html>
